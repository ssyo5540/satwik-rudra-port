name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project page => the site is served from a sub-path.
          NEXT_PUBLIC_BASE_PATH: /satwik-rudra-port

      # NOTE: Pages must be enabled once by hand (Settings -> Pages -> Source ->
      # GitHub Actions). The workflow token cannot create a Pages site from
      # scratch -- it returns "Resource not accessible by integration" -- so
      # `enablement` can only flip the source on a site that already exists.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
